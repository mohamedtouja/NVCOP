[package]
name = "novagraph_rust"
version = "0.1.0"
edition = "2024"
authors = ["NovaGraph Team <team@novagraph.example>"]
description = "NovaGraph Compressor experimental Rust port (Phase 1)."
license = "MIT"

[dependencies]
sha2 = "0.11"
rayon = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.2"
flate2 = { version = "1.0", features = ["zlib", "gzip"] }
brotli = "4.0"
zstd = "0.12"
sysinfo = { version = "0.28", features = ["process"] }

[dev-dependencies]
tempfile = "3.6"
